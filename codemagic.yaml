workflows:
  android-apk:
    name: Android APK Build

    environment:
      node: 22

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Install EAS CLI
        script: |
          npm install -g eas-cli

      - name: Build APK
        script: |
          cd apps/mobile
          eas build --platform android --profile preview --non-interactive

    artifacts:
      - apps/mobile/*.apk
